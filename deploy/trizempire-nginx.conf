# TrizEmpire — nginx TLS termination in front of the nexora server.
#
# Install:
#   1. Replace triz.example.internal (4 places) with your hostname.
#   2. ln -s /etc/nginx/sites-available/trizempire.conf /etc/nginx/sites-enabled/
#      (or include it from your http {} block)
#   3. mkdir -p /var/www/certbot/.well-known/acme-challenge
#      certbot certonly --webroot -w /var/www/certbot -d triz.example.internal
#   4. nginx -t && systemctl reload nginx
#      certbot renew --dry-run   # renewal timer reloads nginx via deploy hook
#
# The upstream is the loopback bind the systemd unit (deploy/trizempire.service)
# pins: HOST=127.0.0.1, PORT=57004. If you change one, change both.

# ── port 80: ACME challenges, then redirect to HTTPS ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name triz.example.internal;

    # HTTP-01 validation must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── port 443: TLS ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx >= 1.25.1; older: listen 443 ssl http2;
    server_name triz.example.internal;
    server_tokens off;

    # Let's Encrypt full chain (certificate + intermediates) and private key.
    ssl_certificate     /etc/letsencrypt/live/triz.example.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triz.example.internal/privkey.pem;

    # Mozilla "intermediate" profile: TLS 1.2 + 1.3, AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Two years, no preload. Comment out until HTTPS has been verified, and
    # drop includeSubDomains if any subdomain cannot serve HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:57004;
        proxy_http_version 1.1;

        # Host must survive the proxy: the app compares Origin/Referer
        # against the request Host for CSRF, and X-Forwarded-Proto tells it
        # the client-facing scheme. Origin and Referer themselves pass
        # through nginx unmodified.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # The API only accepts small JSON bodies (login, CSRF header).
        client_max_body_size 16k;
    }
}
